[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  # Public port 3030 matches this org's Sigma Plugin Dev Playground.
  # Vite sits behind Netlify on 3040.
  command = "npm run dev -- --port 3040 --strictPort"
  targetPort = 3040
  port = 3030
  framework = "#custom"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
